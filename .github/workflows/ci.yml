name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: the test target links only PluginLogic and gtest, so no JUCE
  # module is compiled and no system library is linked. Runs first and gates
  # the platform builds.
  unit-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Configure still parses the full project (add_subdirectory(deps/JUCE)
      # and juce_add_plugin both run), so JUCE's pkg-config modules must be
      # present even though only PluginLogic is compiled. They are the -dev
      # packages only; nothing here links against them.
      - name: Install build tools and JUCE configure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache \
            libasound2-dev libfreetype-dev libfontconfig1-dev

      - name: Configure
        run: cmake --preset linux-release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: cmake --build --preset linux-release --target PluginLogicTests

      - name: Test
        run: ctest --preset linux-release

  build:
    name: ${{ matrix.name }}
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Debug
            os: ubuntu-22.04
            preset: linux-debug
            config: Debug
            artifact: GlassDown-linux-debug

          - name: Linux Release
            os: ubuntu-22.04
            preset: linux-release
            config: Release
            artifact: GlassDown-linux-release

          - name: macOS Debug
            os: macos-14
            preset: macos-debug
            config: Debug
            artifact: GlassDown-macos-debug

          - name: macOS Release
            os: macos-14
            preset: macos-release
            config: Release
            artifact: GlassDown-macos-release

          - name: Windows Debug
            os: windows-2022
            preset: windows-debug
            config: Debug
            artifact: GlassDown-windows-debug

          - name: Windows Release
            os: windows-2022
            preset: windows-release
            config: Release
            artifact: GlassDown-windows-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}
          key: ${{ matrix.preset }}-${{ hashFiles('deps/googletest/CMakeLists.txt', 'deps/JUCE/CMakeLists.txt', 'src/**', 'tests/**', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ matrix.preset }}-

      - name: Install JUCE dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Configure (ccache)
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # JUCE places artefacts under GlassDown_artefacts/<Config>/, where <Config>
      # is Release or Debug.
      - name: Upload plugin artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/${{ matrix.preset }}/GlassDown_artefacts/${{ matrix.config }}/VST3
            build/${{ matrix.preset }}/GlassDown_artefacts/${{ matrix.config }}/Standalone
          if-no-files-found: warn